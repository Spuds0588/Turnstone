<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Turnstone master logo: a circular grey stone with an engraved dark-grey checkmark.
       The engraving is two offset copies of the check: the darker stone shade, shifted +1,+1,
       reads as the shadowed lower lip of a groove; the main check color sits above it. -->
  <defs>
    <radialGradient id="stoneShade" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#cfcfcf"/>
      <stop offset="0.72" stop-color="#a8a8a8"/>
      <stop offset="1" stop-color="#8f8f8f"/>
    </radialGradient>
  </defs>

  <!-- the stone -->
  <circle cx="256" cy="256" r="248" fill="url(#stoneShade)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#7c7c7c" stroke-width="7"/>

  <!-- engraved check: shadow lip first, then the check itself -->
  <path d="M148 268 L232 352 L368 180" fill="none" stroke="#6f6f6f"
        stroke-width="52" stroke-linecap="round" stroke-linejoin="round"
        transform="translate(2 2)"/>
  <path d="M148 268 L232 352 L368 180" fill="none" stroke="#4a4a4a"
        stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
