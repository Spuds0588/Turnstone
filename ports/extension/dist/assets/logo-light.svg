<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Light-theme variant: the stone is lightened so it doesn't vanish on white surfaces.
       Same geometry and engraving technique as logo.svg. -->
  <defs>
    <radialGradient id="stoneShadeL" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#e6e6e6"/>
      <stop offset="0.72" stop-color="#c4c4c4"/>
      <stop offset="1" stop-color="#a6a6a6"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#stoneShadeL)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#8e8e8e" stroke-width="7"/>

  <path d="M148 268 L232 352 L368 180" fill="none" stroke="#7d7d7d"
        stroke-width="52" stroke-linecap="round" stroke-linejoin="round"
        transform="translate(2 2)"/>
  <path d="M148 268 L232 352 L368 180" fill="none" stroke="#525252"
        stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
