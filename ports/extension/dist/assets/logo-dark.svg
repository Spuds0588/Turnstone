  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#stoneShadeD)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#5c5f66" stroke-width="7"/>

  <path d="M148 268 L232 352 L368 180" fill="none" stroke="#6f6f6f"
